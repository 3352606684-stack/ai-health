build\",\n    \"preview\": \"vite preview\"\n  },\n  \"dependencies\": {\n    \"@element-plus/icons-vue\": \"^2.3.2\",\n    \"axios\": \"^1.20.0\",\n    \"echarts\": \"^6.1.0\",\n    \"element-plus\": \"^2.14.7\",\n    \"vue\": \"^3.5.44\",\n    \"vue-router\": \"^5.4.0\"\n  },\n  \"devDependencies\": {\n    \"@vitejs/plugin-vue\": \"^6.0.10\",\n    \"unplugin-auto-import\": \"^21.1.0\",\n    \"unplugin-vue-components\": \"^32.1.0\",\n    \"vite\": \"^8.3.5\"\n  }\n}\n"},{"id":"f7","group":"前端 · 工程配置","rel":"frontend/vite.config.js","label":"vite.config.js","note":"构建与代理配置","lang":"js","lines":40,"size":1113,"code":"import { fileURLToPath, URL } from 'node:url'\nimport { defineConfig } from 'vite'\nimport vue from '@vitejs/plugin-vue'\nimport AutoImport from 'unplugin-auto-import/vite'\nimport Components from 'unplugin-vue-components/vite'\nimport { ElementPlusResolver } from 'unplugin-vue-components/resolvers'\n\n// Element Plus 采用\"按需自动导入\"：模板里直接写 \u003cel-button> 即可，\n// 组件与样式由 unplugin 自动注入，无需在 main.js 里 app.use(ElementPlus)。\nexport default defineConfig({\n  plugins: [\n    vue(),\n    AutoImport({\n      imports: ['vue', 'vue-router'],\n      resolvers: [ElementPlusResolver()],\n      dts: 'src/auto-imports.d.ts'\n    }),\n    Components({\n      resolvers: [ElementPlusResolver()],\n      dts: 'src/components.d.ts'\n    })\n  ],\n  resolve: {\n    alias: {\n      '@': fileURLToPath(new URL('./src', import.meta.url))\n    }\n  },\n  server: {\n    port: 5173,\n    open: false,\n    proxy: {\n      // 前端 /api/xxx -> 后端 http://localhost:8080/api/xxx，避免跨域\n      '/api': {\n        target: 'http://localhost:8080',\n        changeOrigin: true\n      }\n    }\n  }\n})\n"},{"id":"f8","group":"前端 · 入口与样式","rel":"frontend/src/main.js","label":"src/main.js","note":"应用入口","lang":"js","lines":10,"size":305,"code":"import { createApp } from 'vue'\nimport App from './App.vue'\nimport router from './router/index.js'\nimport './styles/base.css'\n\n// Element Plus 由 vite.config.js 里的 unplugin 按需自动导入，\n// 这里不需要 import ElementPlus 或注册样式文件。\n\ncreateApp(App).use(router).mount('#app')\n"},{"id":"f9","group":"前端 · 入口与样式","rel":"frontend/src/App.vue","label":"src/App.vue","note":"根组件","lang":"vue","lines":9,"size":185,"code":"\u003ctemplate>\n  \u003crouter-view />\n\u003c/template>\n\n\u003cscript setup>\n// 根组件只负责渲染路由匹配到的页面，\n// 具体页面内容放在 src/component 或 src/views 下。\n\u003c/script>\n"},{"id":"f10","group":"前端 · 入口与样式","rel":"frontend/src/styles/base.css","label":"src/styles/base.css","note":"全局样式","lang":"css","lines":22,"size":421,"code":"/* 全局基础样式：Element Plus 是按需引入的，不会重置 body 默认的 8px 外边距 */\nhtml,\nbody,\n#app {\n  height: 100%;\n  margin: 0;\n  padding: 0;\n  overflow: hidden;\n}\n\nbody {\n  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',\n    'Microsoft YaHei', sans-serif;\n  color: #1f2430;\n  background: #f5f7fa;\n  -webkit-font-smoothing: antialiased;\n}\n\n* {\n  scrollbar-width: thin;\n}\n"},{"id":"f11","group":"前端 · 路由与接口","rel":"frontend/src/router/index.js","label":"src/router/index.js","note":"路由表","lang":"js","lines":50,"size":1213,"code":"import { createRouter, createWebHistory } from 'vue-router'\nimport Backendlayout from '../component/Backendlayout.vue'\n\n// 路由配置：path / name / title 需与 layout 里 menus 数组保持一致\nconst backendRoutes = [\n  {\n    path: '/',\n    redirect: '/back/dashboard'\n  },\n  {\n    path: '/back',\n    name: 'Backend',\n    component: Backendlayout,\n    redirect: '/back/dashboard',\n    children: [\n      {\n        path: 'dashboard',\n        name: 'Dashboard',\n        component: () => import('../views/dashboard.vue'),\n        meta: { title: '数据分析' }\n      },\n      {\n        path: 'knowledge',\n        name: 'Knowledge',\n        component: () => import('../views/knowledge.vue'),\n        meta: { title: '知识文章' }\n      },\n      {\n        path: 'consultation',\n        name: 'Consultation',\n        component: () => import('../views/consultation.vue'),\n        meta: { title: '咨询管理' }\n      },\n      {\n        path: 'emotion',\n        name: 'Emotion',\n        component: () => import('../views/emotionLog.vue'),\n        meta: { title: '情绪日志' }\n      }\n    ]\n  }\n]\n\nconst router = createRouter({\n  history: createWebHistory(),\n  routes: backendRoutes\n})\n\nexport default router\n"},{"id":"f12","group":"前端 · 路由与接口","rel":"frontend/src/api/request.js","label":"src/api/request.js","note":"axios 封装","lang":"js","lines":49,"size":1319,"code":"import axios from 'axios'\nimport { ElMessage } from 'element-plus'\n\n// 统一的 axios 实例：baseURL 走 vite 代理，/api -> http://localhost:8080\nconst request = axios.create({\n  baseURL: '/api',\n  timeout: 10000\n})\n\n// 请求拦截：统一带上 token（登录功能接入后即可生效）\nrequest.interceptors.request.use(\n  (config) => {\n    const token = localStorage.getItem('token')\n    if (token) {\n      config.headers.Authorization = `Bearer ${token}`\n    }\n    return config\n  },\n  (error) => Promise.reject(error)\n)\n\n// 响应拦截：直接返回 data，错误统一转成中文提示\nrequest.interceptors.response.use(\n  (response) => response.data,\n  (error) => {\n    const status = error.response?.status\n    let msg\n\n    if (!error.response) {\n      msg = '网络异常，无法连接后端服务'\n    } else if (status === 401) {\n      msg = '登录已过期，请重新登录'\n    } else if (status === 403) {\n      msg = '没有访问权限'\n    } else if (status === 404) {\n      msg = '接口不存在，请检查路径'\n    } else if (status >= 500) {\n      msg = '后端服务异常，请确认服务已启动'\n    } else {\n      msg = error.response?.data?.message || '请求失败'\n    }\n\n    ElMessage.error(msg)\n    return Promise.reject(new Error(msg))\n  }\n)\n\nexport default request\n"},{"id":"f13","group":"前端 · 路由与接口","rel":"frontend/src/api/dashboard.js","label":"src/api/dashboard.js","note":"看板接口调用","lang":"js","lines":7,"size":176,"code":"import request from './request'\n\n/** 数据分析首页统计（GET /api/dashboard/stats） */\nexport function getDashboardStats() {\n  return request.get('/dashboard/stats')\n}\n"},{"id":"f14","group":"前端 · 布局组件","rel":"frontend/src/component/Backendlayout.vue","label":"src/component/Backendlayout.vue","note":"后台布局（路由实际引用）","lang":"vue","lines":254,"size":5310,"code":"\u003ctemplate>\n  \u003cel-container class=\"layout\">\n    \u003c!-- ===== 左侧导航栏 ===== -->\n    \u003cel-aside class=\"aside\" :width=\"isCollapse ? '64px' : '200px'\">\n      \u003cdiv class=\"logo\">\n        \u003cdiv class=\"logo-icon\">\n          \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            \u003crect x=\"3.5\" y=\"5.5\" width=\"17\" height=\"12\" rx=\"3\" />\n            \u003cpath d=\"M9 20.5h6\" />\n            \u003ccircle cx=\"9.2\" cy=\"11.5\" r=\"1\" fill=\"#ffffff\" stroke=\"none\" />\n            \u003ccircle cx=\"14.8\" cy=\"11.5\" r=\"1\" fill=\"#ffffff\" stroke=\"none\" />\n          \u003c/svg>\n        \u003c/div>\n        \u003cdiv v-show=\"!isCollapse\" class=\"logo-text\">\n          \u003cdiv class=\"logo-title\">心理健康AI助手\u003c/div>\n          \u003cdiv class=\"logo-sub\">管理后台\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 菜单由 menus 数组驱动，与 router 的 children 一一对应 -->\n      \u003cel-menu\n        class=\"menu\"\n        :default-active=\"activeMenu\"\n        :collapse=\"isCollapse\"\n        :collapse-transition=\"false\"\n        router\n      >\n        \u003cel-menu-item v-for=\"item in menus\" :key=\"item.path\" :index=\"item.path\">\n          \u003cel-icon>\n            \u003ccomponent :is=\"item.icon\" />\n          \u003c/el-icon>\n          \u003ctemplate #title>{{ item.title }}\u003c/template>\n        \u003c/el-menu-item>\n      \u003c/el-menu>\n    \u003c/el-aside>\n\n    \u003c!-- ===== 右侧内容区 ===== -->\n    \u003cel-container class=\"right\">\n      \u003cel-header class=\"header\">\n        \u003cdiv class=\"header-left\">\n          \u003cel-icon class=\"toggle\" @click=\"isCollapse = !isCollapse\">\n            \u003cExpand v-if=\"isCollapse\" />\n            \u003cFold v-else />\n          \u003c/el-icon>\n          \u003cspan class=\"page-title\">{{ pageTitle }}\u003c/span>\n        \u003c/div>\n\n        \u003cel-dropdown trigger=\"click\">\n          \u003cspan class=\"user-box\">\n            \u003cel-avatar :size=\"26\" class=\"avatar\">A\u003c/el-avatar>\n            \u003cspan class=\"username\">admin\u003c/span>\n            \u003cel-icon class=\"caret\">\u003cArrowDown />\u003c/el-icon>\n          \u003c/span>\n          \u003ctemplate #dropdown>\n            \u003cel-dropdown-menu>\n              \u003cel-dropdown-item>退出登录\u003c/el-dropdown-item>\n            \u003c/el-dropdown-menu>\n          \u003c/template>\n        \u003c/el-dropdown>\n      \u003c/el-header>\n\n      \u003cel-main class=\"main\">\n        \u003crouter-view />\n      \u003c/el-main>\n    \u003c/el-container>\n  \u003c/el-container>\n\u003c/template>\n\n\u003cscript setup>\nimport { computed, ref } from 'vue'\nimport { useRoute } from 'vue-router'\nimport {\n  ArrowDown,\n  ChatLineSquare,\n  DataAnalysis,\n  Expand,\n  Fold,\n  Message,\n  User\n} from '@element-plus/icons-vue'\n\nconst route = useRoute()\nconst isCollapse = ref(false)\n\nconst menus = [\n  { path: '/back/dashboard', title: '数据分析', icon: DataAnalysis },\n  { path: '/back/knowledge', title: '知识文章', icon: ChatLineSquare },\n  { path: '/back/consultation', title: '咨询管理', icon: Message },\n  { path: '/back/emotion', title: '情绪日志', icon: User }\n]\n\nconst activeMenu = computed(() => route.path)\nconst pageTitle = computed(() => route.meta?.title || '数据分析')\n\u003c/script>\n\n\u003cstyle scoped>\n.layout {\n  height: 100%;\n  overflow: hidden;\n}\n\n.aside {\n  height: 100%;\n  background: #fbfcff;\n  border-right: 1px solid #eef0f5;\n  display: flex;\n  flex-direction: column;\n  transition: width 0.2s ease;\n  overflow: hidden;\n}\n\n.logo {\n  height: 64px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 0 15px;\n  flex-shrink: 0;\n}\n\n.logo-icon {\n  width: 34px;\n  height: 34px;\n  flex: 0 0 34px;\n  border-radius: 9px;\n  background: #2fb6c8;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 7px;\n  box-sizing: border-box;\n}\n\n.logo-text {\n  overflow: hidden;\n  white-space: nowrap;\n}\n\n.logo-title {\n  font-size: 14px;\n  font-weight: 600;\n  color: #1f2430;\n  line-height: 1.2;\n}\n\n.logo-sub {\n  font-size: 11px;\n  color: #9aa0ac;\n  margin-top: 3px;\n}\n\n.menu {\n  border-right: none;\n  background: transparent;\n  padding: 4px 10px;\n  flex: 1;\n}\n\n.menu :deep(.el-menu-item) {\n  height: 44px;\n  line-height: 44px;\n  border-radius: 8px;\n  margin-bottom: 6px;\n  color: #5c6270;\n  font-size: 14px;\n}\n\n.menu :deep(.el-menu-item:hover) {\n  background: #f2f4fa;\n}\n\n.menu :deep(.el-menu-item.is-active) {\n  background: #eef0fe;\n  color: #5b6ef5;\n  font-weight: 500;\n}\n\n.menu :deep(.el-menu-item .el-icon) {\n  font-size: 17px;\n  width: 17px;\n  margin-right: 10px;\n  flex-shrink: 0;\n}\n\n/* 折叠时图标居中，不保留右侧留白 */\n.menu.el-menu--collapse :deep(.el-menu-item .el-icon) {\n  margin-right: 0;\n}\n\n/* ---- 顶栏 ---- */\n.right {\n  min-width: 0;\n}\n\n.header {\n  height: 58px;\n  background: #ffffff;\n  border-bottom: 1px solid #eef0f5;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 0 20px;\n}\n\n.header-left {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n}\n\n.toggle {\n  font-size: 19px;\n  color: #606266;\n  cursor: pointer;\n}\n\n.page-title {\n  font-size: 19px;\n  font-weight: 600;\n  color: #1f2430;\n}\n\n.user-box {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  cursor: pointer;\n  outline: none;\n}\n\n.avatar {\n  background: #e8ecff;\n  color: #5b6ef5;\n  font-size: 13px;\n}\n\n.username {\n  font-size: 14px;\n  color: #303133;\n}\n\n.caret {\n  font-size: 14px;\n  color: #909399;\n}\n\n/* ---- 内容区 ---- */\n.main {\n  background: #f5f7fa;\n  padding: 16px;\n  overflow-y: auto;\n}\n\u003c/style>\n"},{"id":"f15","group":"前端 · 布局组件","rel":"frontend/src/components/Backendlayout.vue","label":"src/components/Backendlayout.vue","note":"后台布局（疑似重复残留）","lang":"vue","lines":5,"size":64,"code":"\u003ctemplate>\n   \u003cdiv>\n    我是后台组件\n   \u003c/div>\n\u003c/template>"},{"id":"f16","group":"前端 · 页面视图","rel":"frontend/src/views/dashboard.vue","label":"src/views/dashboard.vue","note":"数据分析","lang":"vue","lines":436,"size":10716,"code":"\u003ctemplate>\n  \u003cdiv class=\"dashboard\">\n    \u003c!-- 加载中 -->\n    \u003cdiv v-if=\"loading\" class=\"panel\">\n      \u003cel-skeleton :rows=\"9\" animated />\n    \u003c/div>\n\n    \u003c!-- 加载失败 -->\n    \u003cel-result\n      v-else-if=\"error\"\n      icon=\"warning\"\n      title=\"数据加载失败\"\n      :sub-title=\"error\"\n    >\n      \u003ctemplate #extra>\n        \u003cel-button type=\"primary\" @click=\"load\">重新加载\u003c/el-button>\n      \u003c/template>\n    \u003c/el-result>\n\n    \u003c!-- 正常内容 -->\n    \u003ctemplate v-else-if=\"stats\">\n      \u003c!-- ===== 顶部四个统计卡片 ===== -->\n      \u003cel-row :gutter=\"16\" class=\"stat-row\">\n        \u003cel-col :span=\"6\" v-for=\"item in stats.statCards\" :key=\"item.key\">\n          \u003cdiv class=\"stat-card\">\n            \u003cdiv\n              class=\"stat-icon\"\n              :style=\"{ background: COLORS[item.key] || '#7c6cf5' }\"\n            >\n              \u003csvg\n                viewBox=\"0 0 24 24\"\n                fill=\"none\"\n                stroke=\"#ffffff\"\n                stroke-width=\"1.7\"\n                stroke-linecap=\"round\"\n                stroke-linejoin=\"round\"\n              >\n                \u003cpath :d=\"ICONS[item.key] || ICONS.user\" />\n              \u003c/svg>\n            \u003c/div>\n            \u003cdiv class=\"stat-body\">\n              \u003cdiv class=\"stat-label\">{{ item.label }}\u003c/div>\n              \u003cdiv class=\"stat-value\">{{ item.value }}\u003c/div>\n              \u003cdiv class=\"stat-extra\">{{ item.extra }}\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/el-col>\n      \u003c/el-row>\n\n      \u003c!-- ===== 趋势 + 会话统计 ===== -->\n      \u003cel-row :gutter=\"16\" class=\"chart-row\">\n        \u003cel-col :span=\"12\">\n          \u003cdiv class=\"panel\">\n            \u003cdiv class=\"panel-title\">情绪趋势分析\u003c/div>\n            \u003cdiv ref=\"moodRef\" class=\"chart chart-lg\">\u003c/div>\n          \u003c/div>\n        \u003c/el-col>\n\n        \u003cel-col :span=\"12\">\n          \u003cdiv class=\"panel\">\n            \u003cdiv class=\"panel-title\">咨询会话统计\u003c/div>\n            \u003cdiv class=\"mini-stats\">\n              \u003cdiv class=\"mini-item\">\n                \u003cdiv class=\"mini-label\">总会话数\u003c/div>\n                \u003cdiv class=\"mini-value\">{{ stats.consult.total }}\u003c/div>\n              \u003c/div>\n              \u003cdiv class=\"mini-item\">\n                \u003cdiv class=\"mini-label\">平均时长\u003c/div>\n                \u003cdiv class=\"mini-value\">\n                  {{ stats.consult.avgDuration }}\u003cspan class=\"mini-unit\">分钟\u003c/span>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv class=\"mini-item\">\n                \u003cdiv class=\"mini-label\">活跃用户\u003c/div>\n                \u003cdiv class=\"mini-value\">{{ stats.consult.activeUsers }}\u003c/div>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"sub-title\">咨询活动统计\u003c/div>\n            \u003cdiv ref=\"consultRef\" class=\"chart chart-sm\">\u003c/div>\n          \u003c/div>\n        \u003c/el-col>\n      \u003c/el-row>\n\n      \u003c!-- ===== 用户活跃趋势 ===== -->\n      \u003cdiv class=\"panel\">\n        \u003cdiv class=\"panel-title\">用户活跃趋势\u003c/div>\n        \u003cdiv ref=\"activeRef\" class=\"chart chart-lg\">\u003c/div>\n      \u003c/div>\n    \u003c/template>\n  \u003c/div>\n\u003c/template>\n\n\u003cscript setup>\nimport { nextTi     metaEl.textContent = f.lines + ' 行 · ' + (f.size / 1024).toFixed(1) + ' KB';
    var nums = [];
    for (var n = 1; n <= f.lines; n++) nums.push(n);
    viewer.innerHTML = '<div class="codewrap"><div class="ln">' + nums.join('\n') +
      '</div><pre class="code">' + highlight(f.code, f.lang) + '</pre></div>';
    viewer.scrollTop = 0;
    copyBtn.textContent = '复制代码';
    copyBtn.classList.remove('ok');
  }
  window.select = select;

  copyBtn.onclick = function () {
    if (!current) return;
    var done = function () {
      copyBtn.textContent = '已复制 ✓';
      copyBtn.classList.add('ok');
      setTimeout(function () { copyBtn.textContent = '复制代码'; copyBtn.classList.remove('ok'); }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(current.code).then(done, function () { fallback(); done(); });
    } else { fallback(); done(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = current.code;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) { }
      ta.remove();
    }
  };

  /* ---------------- 筛选 ---------------- */
  document.getElementById('filter').oninput = function (e) {
    var q = e.target.value.trim().toLowerCase();
    var wraps = document.querySelectorAll('.group');
    for (var i = 0; i < wraps.length; i++) {
      var vis = 0;
      var items = wraps[i].querySelectorAll('.item');
      for (var j = 0; j < items.length; j++) {
        var hit = !q || items[j].dataset.search.indexOf(q) !== -1;
        items[j].style.display = hit ? '' : 'none';
        if (hit) vis++;
      }
      wraps[i].style.display = vis ? '' : 'none';
      if (q && vis) wraps[i].classList.remove('collapsed');
    }
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      document.getElementById('filter').focus();
    }
  });

  select(FILES[0].id);
})();

</script>
</body>
</html>
